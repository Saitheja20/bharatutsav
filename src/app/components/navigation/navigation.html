<!-- ═══════════════════════════════════════════════════════════
     BharatUtsav Sidebar Navigation
     ═══════════════════════════════════════════════════════════ -->
<ng-container *ngIf="isAuth">

  <!-- Mobile top bar -->
  <header class="bu-topbar">
    <button class="bu-topbar-toggle" (click)="toggleSidebar()" aria-label="Toggle menu">
      <i class="fas fa-bars"></i>
    </button>
    <span class="bu-topbar-brand">BharatUtsav</span>
    <div class="bu-topbar-user">
      <span class="bu-topbar-username">{{ userName }}</span>
      <img src="images/basics/defaultimage.png" [attr.alt]="userName + ' avatar'" class="bu-topbar-avatar">
    </div>
  </header>

  <!-- Sidebar overlay (mobile) -->
  <div class="bu-sidebar-overlay" [class.active]="sidebarOpen" (click)="closeSidebar()"></div>

  <!-- Sidebar -->
  <aside class="bu-sidebar" [class.open]="sidebarOpen">

    <!-- Brand -->
    <div class="bu-sidebar-brand">
      <img src="images/logo/main-logo.png" alt="BharatUtsav Logo" class="bu-sidebar-logo">
      <div class="bu-sidebar-brand-text">
        <span class="bu-sidebar-brand-name">BharatUtsav</span>
        <span class="bu-sidebar-brand-tagline">Festival Ledger</span>
      </div>
    </div>

    <!-- Nav links -->
    <nav class="bu-sidebar-nav">
      <a class="bu-sidebar-link"
         routerLink="/dashboard"
         routerLinkActive="active"
         (click)="closeSidebar()">
        <span class="bu-sidebar-link-icon"><i class="fas fa-th-large"></i></span>
        <span class="bu-sidebar-link-label">Dashboard</span>
      </a>

      <a class="bu-sidebar-link"
         routerLink="/organizations"
         routerLinkActive="active"
         (click)="closeSidebar()">
        <span class="bu-sidebar-link-icon"><i class="fas fa-building"></i></span>
        <span class="bu-sidebar-link-label">Organizations</span>
      </a>

      <a class="bu-sidebar-link"
         routerLink="/chanda-book"
         routerLinkActive="active"
         (click)="closeSidebar()">
        <span class="bu-sidebar-link-icon"><i class="fas fa-book"></i></span>
        <span class="bu-sidebar-link-label">Chanda Book</span>
      </a>

      <a class="bu-sidebar-link"
         routerLink="/transactions"
         routerLinkActive="active"
         (click)="closeSidebar()">
        <span class="bu-sidebar-link-icon"><i class="fas fa-exchange-alt"></i></span>
        <span class="bu-sidebar-link-label">Transactions</span>
      </a>

      <a class="bu-sidebar-link"
         *ngIf="userRole === 'admin'"
         routerLink="/members"
         routerLinkActive="active"
         (click)="closeSidebar()">
        <span class="bu-sidebar-link-icon"><i class="fas fa-users"></i></span>
        <span class="bu-sidebar-link-label">Members</span>
      </a>
    </nav>

    <!-- Bottom user section -->
    <div class="bu-sidebar-footer">
      <div class="bu-sidebar-user">
        <img src="images/basics/defaultimage.png" [attr.alt]="userName + ' avatar'" class="bu-sidebar-user-avatar">
        <div class="bu-sidebar-user-info">
          <span class="bu-sidebar-user-name">{{ userName }}</span>
          <span class="bu-sidebar-user-role">{{ userRole | titlecase }}</span>
        </div>
      </div>
      <button class="bu-sidebar-signout" (click)="signOut()" title="Sign Out">
        <i class="fas fa-sign-out-alt"></i>
      </button>
    </div>

  </aside>

</ng-container>
