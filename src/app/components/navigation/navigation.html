<nav class="navbar navbar-expand-lg navbar-dark bg-primary" *ngIf="isAuth">
  <div class="container">
    <a class="navbar-brand" routerLink="/dashboard">
      <img src="images/logo/main-logo.png"
           alt="BharatUtsav Logo" class="rounded-circle me-2"
           width="42" height="42">
      BharatUtsav
    </a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
            data-bs-target="#navbarNav" aria-controls="navbarNav"
            aria-expanded="false" aria-label="Toggle navigation">
      <i class="fas fa-bars" style="color: black; font-size: 24px;"></i>
    </button>

    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav me-auto">
        <li class="nav-item">
          <a class="nav-link" routerLink="/dashboard" routerLinkActive="active">
            <i class="fas fa-home me-1"></i>Dashboard
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/organizations" routerLinkActive="active">
            <i class="fas fa-building me-2"></i>Organizations
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/transactions" routerLinkActive="active">
            <i class="fas fa-exchange-alt me-1"></i>Transactions
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/chanda-book" routerLinkActive="active">
            <i class="fas fa-book me-2"></i>Chanda Book
          </a>
        </li>
        <li class="nav-item" *ngIf="userRole === 'admin'">
          <a class="nav-link" routerLink="/members" routerLinkActive="active">
            <i class="fas fa-users me-1"></i>Members
          </a>
        </li>
      </ul>

      <!-- User Menu -->
      <div class="navbar-nav">
        <div class="nav-item dropdown">
          <a class="nav-link dropdown-toggle d-flex align-items-center"
             href="#" id="userDropdown" role="button"
             data-bs-toggle="dropdown" aria-expanded="false">

            <!-- Fixed Google Profile Photo -->
            <img [src]="userPhotoUrl || defaultPhotoUrl"
                 (error)="onImageError($event)"
                 alt="User Profile"
                 class="rounded-circle me-2"
                 width="32"
                 height="32"
                 referrerpolicy="no-referrer"
                 style="object-fit: cover; border: 2px solid white;">

            <span id="userName">{{ userName }}</span>
          </a>

          <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="userDropdown">
            <li>
              <a class="dropdown-item" href="#" (click)="signOut()">
                <i class="fas fa-sign-out-alt me-2"></i>Sign Out
              </a>
            </li>
          </ul>
        </div>
      </div>
    </div>
  </div>
</nav>
